name: Build Local Office APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint \
            libtool libtool-bin pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev gettext

      - name: Install Buildozer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv build_env
          source build_env/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer
          buildozer --version

      - name: Configure Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          test -f buildozer.spec || {
            echo "::error::buildozer.spec not found"
            exit 1
          }

          # Включаем штатное принятие лицензий Buildozer
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          content = path.read_text()

          pattern = r"(?m)^[ \t]*android\.accept_sdk_license[ \t]*=.*$"
          replacement = "android.accept_sdk_license = True"

          if re.search(pattern, content):
              content = re.sub(pattern, replacement, content)
          else:
              match = re.search(r"(?m)^\[app\][ \t]*$", content)
              if not match:
                  raise SystemExit("Missing [app] section in buildozer.spec")

              next_section = re.search(
                  r"(?m)^\[.+\][ \t]*$",
                  content[match.end():]
              )

              insert_at = (
                  match.end() + next_section.start()
                  if next_section else len(content)
              )

              content = (
                  content[:insert_at].rstrip()
                  + "\nandroid.accept_sdk_license = True\n\n"
                  + content[insert_at:].lstrip("\n")
              )

          path.write_text(content)
          print("SDK license acceptance configured.")
          PY

      - name: Build Android debug APK
        shell: bash
        run: |
          set -uo pipefail
          source build_env/bin/activate

          set +e
          buildozer -v android debug 2>&1 | tee build_log.txt
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "::error::Buildozer failed with exit code $build_status"
            tail -n 100 build_log.txt
            exit "$build_status"
          fi

          shopt -s nullglob
          apks=(bin/*.apk)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Build completed but no APK was found in bin/"
            tail -n 100 build_log.txt
            exit 1
          fi

          mkdir -p artifacts
          cp "${apks[@]}" artifacts/
          ls -lh artifacts/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:
              Local-Office-Build-Log
          path: build_log.txt
          if-no-files-found: ignore
          retention-days: 7