
      - name: Always create diagnostic report
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic

          if [ -f build_log.txt ]; then
            {
              echo "=== BUILD ERRORS ==="
              grep -in -B 5 -A 10 -E \
                'error:|fatal error|exception|traceback|failed|failure|LT_SYS_SYMBOL_USCORE|undefined macro|license|permission denied|not found|timed out' \
                build_log.txt | tail -n 120 || true

              echo
              echo "=== LAST 80 LINES ==="
              tail -n 80 build_log.txt
            } > diagnostic/error_summary.txt
          else
            echo "build_log.txt was not created." > diagnostic/error_summary.txt
          fi

          ls -lah diagnostic
          cat diagnostic/error_summary.txt

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-Diagnostic
          path: diagnostic/error_summary.txt
          if-no-files-found: error
          retention-days: 3
