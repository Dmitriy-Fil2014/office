
name: Local Office Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip curl wget \
            autoconf automake autopoint libtool \
            libtool-bin pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libxml2-dev libxslt1-dev

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      - name: Check project files
        run: |
          test -f buildozer.spec
          test -f main.py
          echo "Project files found"

      - name: Build APK
        shell: bash
        run: |
          mkdir -p dist build-report
          set +e
          yes | buildozer -v android debug \
            2>&1 | tee build-report/build.log
          result=${PIPESTATUS[1]}
          set -e

          if [ "$result" -ne 0 ]; then
            tail -n 150 build-report/build.log
            exit "$result"
          fi

          find . -type f -name "*.apk" \
            -not -path "./.buildozer/*" \
            -not -path "./.git/*" \
            -exec cp {} dist/ \;

          if ! find dist -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          ls -lh dist/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-APK
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-Build-Log
          path: build-report/build.log
          if-no-files-found: warn
