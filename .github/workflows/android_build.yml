name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Скачиваем чистый код проекта
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 под требования Node 24
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Устанавливаем системные пакеты Linux для компиляции макросов C-библиотек
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    # 4. Устанавливаем Buildozer и Cython в систему
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip --break-system-packages
        pip3 install cython virtualenv wheel setuptools --break-system-packages
        pip3 install git+https://github.com --break-system-packages

    # 5. Запускаем компиляцию APK с системным флагом обхода Root-прав
    - name: Build Android APK
      env:
        # Этот флаг принудительно заставляет Buildozer работать в облаке от имени root без вопросов [y/n]
        BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1
      run: |
        buildozer android debug

    # 6. Загружаем готовый APK-файл в раздел артефактов GitHub
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Local-Office-APK
        path: bin/*.apk
