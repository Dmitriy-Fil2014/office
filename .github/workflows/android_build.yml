name: Build Local Office APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint m4 \
            libtool libtool-bin \
            pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev

      - name: Install Buildozer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv build_env
          source build_env/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer
          buildozer --version

      - name: Configure SDK license acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -f buildozer.spec
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("buildozer.spec")
          text = path.read_text()
          app = re.search(r"(?m)^\[app\]\s*$", text)
          if not app:
              raise SystemExit("ERROR: [app] section missing")
          following = re.search(r"(?m)^\[.+\]\s*$", text[app.end():])
          end = app.end() + following.start() if following else len(text)
          section = text[app.end():end]
          key = r"(?m)^[ \t]*android\.accept_sdk_license[ \t]*=.*$"
          if re.search(key, section):
              section = re.sub(key, "android.accept_sdk_license = True", section)
          else:
              section += "\nandroid.accept_sdk_license = True\n"
          path.write_text(text[:app.end()] + section + text[end:])
          print("Configured SDK license acceptance in [app].")
          PY

      # ВАЖНО: Патчим макросы Autotools перед компиляцией C-библиотек
      - name: Fix Autotools Macro M4
        run: |
          sudo ln -s /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltoptions.m4 /usr/share/aclocal/ltsugar.m4 /usr/share/aclocal/ltversion.m4 /usr/share/aclocal/lt~obsolete.m4 /usr/share/autoconf/ 2>/dev/null || true

      - name: Build Android debug APK
        shell: bash
        run: |
          set -uo pipefail
          source build_env/bin/activate

          buildozer android clean || {
            echo "Clean command failed; continuing to diagnostic build."
          }

          set +e
          buildozer -v android debug 2>&1 | tee build_log.txt
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::Buildozer failed with exit code $status"
            echo "----- Final build log -----"
            tail -n 100 build_log.txt
            exit "$status"
          fi

          shopt -s nullglob
          apks=(bin/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK was generated in bin/"
            exit 1
          fi
          mkdir -p artifacts
          cp "${apks[@]}" artifacts/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-APK
          path: artifacts/*.apk
