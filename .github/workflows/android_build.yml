name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Скачиваем чистый код проекта
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 под Node 24
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Устанавливаем системные пакеты Linux
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-venv

    # 4. Настраиваем Buildozer внутри изолированного виртуального окружения
    - name: Install Buildozer in Virtual Env
      run: |
        python3 -m venv build_env
        source build_env/bin/activate
        pip install --upgrade pip wheel setuptools cython virtualenv
        pip install git+https://github.com

    # 5. Принудительно принимаем лицензии Android SDK и запускаем компиляцию
    - name: Build Android APK
      env:
        BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1
      run: |
        source build_env/bin/activate
        
        # Лайфхак: Предустанавливаем и автоматически одобряем все лицензии Android SDK Google
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n893a6cdb5b778b0d15d775b33f99961fdba567bf\n2523027874dba223741079043ac6ee27c63940e4\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        
        # Запускаем сборку
        buildozer android debug 2>&1 | tee build_log.txt || true
        
        # Если APK файл не появился - выводим лог ошибок
        if [ ! -f bin/*.apk ]; then
          echo "::error::--- КРИТИЧЕСКИЙ СБОЙ КОМПИЛЯТОРА СИ-РЕЦЕПТОВ ---"
          tail -n 60 build_log.txt | while read -r line; do echo "::error::$line"; done
          exit 1
        fi

    # 6. Загружаем готовый APK-файл в раздел артефактов GitHub
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Local-Office-APK
        path: bin/*.apk
