name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Клонируем ваш код (игнорируем конфликты вложенных git-папок)
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 (Перешли на официальный актуальный экшен v5)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Кэшируем компоненты Buildozer
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    # 4. Устанавливаем системные библиотеки Linux
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    # 5. Устанавливаем Buildozer и Cython
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer cython virtualenv wheel setuptools

    # 6. Запускаем компиляцию APK
    - name: Build Android APK
      run: |
        yes | buildozer android debug

    # 7. Загружаем готовый APK-файл в артефакты
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Local-Office-APK
        path: bin/*.apk
