name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Скачиваем чистый код проекта
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 под стандарты Android API 34
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Устанавливаем системные пакеты Linux (включая инструменты для сборки Си-библиотек)
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-venv

    # 4. Изолируем сборщик в виртуальном окружении venv, чтобы Node.js 24 не ломал его зависимости
    - name: Install Buildozer in Virtual Env
      run: |
        python3 -m venv build_env
        source build_env/bin/activate
        pip install --upgrade pip wheel setuptools cython virtualenv
        pip install git+https://github.com

    # 5. Запускаем компиляцию с принудительным сохранением лога в файл
    - name: Build Android APK
      env:
        BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1
      run: |
        source build_env/bin/activate
        # Запускаем билд и перенаправляем весь поток (и ошибки, и дебаг) в один файл log.txt
        buildozer android debug 2>&1 | tee build_log.txt || true
        
        # Проверяем, создался ли APK файл
        if [ ! -f bin/*.apk ]; then
          echo "::error::--- КРИТИЧЕСКИЙ СБОЙ КОМПИЛЯТОРА СИ-РЕЦЕПТОВ ---"
          echo "::error::Ниже выведены последние 60 строк детального внутреннего лога Buildozer:"
          tail -n 60 build_log.txt | while read -r line; do echo "::error::$line"; done
          exit 1
        fi

    # 6. Загружаем готовый APK-файл в раздел артефактов GitHub
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Local-Office-APK
        path: bin/*.apk
