

name: Local Office APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip curl wget \
            autoconf automake autopoint libtool libtool-bin \
            pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libxml2-dev libxslt1-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            build-tools;37.0.0
            ndk;28.2.13676358

      - name: Configure Android paths
        shell: bash
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "Android SDK and NDK are installed."
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "Cython==0.29.36"

      - name: Verify project
        shell: bash
        run: |
          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec not found in repository root"
            exit 1
          }

          test -f main.py || {
            echo "ERROR: main.py not found in repository root"
            exit 1
          }

          echo "Project files found."
          echo "Build configuration:"
          grep -nE '^(title|package.name|package.domain|source.dir|requirements|android.api|android.minapi|android.ndk|android.archs)[[:space:]]*=' buildozer.spec || true

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build-report
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build-report/build.log

      - name: Check APK
        if: success()
        shell: bash
        run: |
          mkdir -p dist

          find . -type f -name "*.apk" \
            -not -path "./.buildozer/*" \
            -not -path "./.git/*" \
            -exec cp {} dist/ \;

          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh dist/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-APK
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-Build-Log
          path: build-report/build.log
          if-no-files-found: warn
          retention-days: 14
