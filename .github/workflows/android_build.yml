name: Лист — сборка APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/leaf-loading-and-editor-ui

permissions:
  contents: read

jobs:
  build:
    name: Сборка APK для Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip curl wget \
            autoconf automake autopoint libtool libtool-bin \
            pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libxml2-dev libxslt1-dev

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Configure Android paths
        shell: bash
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          test -x "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          test -x "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl"

      - name: Install Buildozer and host test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36"
          python -m pip install "python-docx" "openpyxl" "pypdf" "python-pptx" "lxml==4.9.3" "typing_extensions==4.12.2"

      - name: Test document processing
        run: |
          python -m py_compile main.py document_core.py
          grep -Fq 'self.config.get("General", "editor_view_mode", fallback="desktop")' main.py
          ! grep -Fq 'self.config.get("General", "editor_view_mode", "desktop")' main.py
          python - <<'PY'
          import io
          from docx import Document
          from openpyxl import Workbook, load_workbook
          from document_core import DocumentProcessor
          from PIL import Image

          # DOCX: text edit must keep a table and embedded image relationship
          doc = Document()
          doc.add_paragraph("First")
          table = doc.add_table(rows=1, cols=1)
          table.cell(0, 0).text = "Cell"
          original = io.BytesIO()
          doc.save(original)
          edited = DocumentProcessor.modify_word_bytes(original.getvalue(), "Changed\nCell edited")
          reopened = Document(io.BytesIO(edited))
          assert reopened.paragraphs[0].text == "Changed"
          assert reopened.tables[0].cell(0, 0).text == "Cell edited"
          reopened.sections[0].header.paragraphs[0].text = "Header text"
          reopened.sections[0].footer.paragraphs[0].text = "Footer text"
          header_footer_source = io.BytesIO()
          reopened.save(header_footer_source)
          extracted_word_text = DocumentProcessor.read_word_bytes(header_footer_source.getvalue())
          assert "Header text" in extracted_word_text and "Footer text" in extracted_word_text

          # XLSX: workbook structure and second sheet survive editing.
          book = Workbook()
          book.active["A1"] = "Old"
          book.create_sheet("Keep")["A1"] = "Preserve"
          original_xlsx = io.BytesIO()
          book.save(original_xlsx)
          edited_xlsx = DocumentProcessor.modify_excel_bytes(original_xlsx.getvalue(), "New")
          reopened_xlsx = load_workbook(io.BytesIO(edited_xlsx))
          assert reopened_xlsx.active["A1"].value == "New"
          assert reopened_xlsx["Keep"]["A1"].value == "Preserve"
          # XLSX cell-grid editing and ZIP signature validation.
          grid_source = DocumentProcessor.create_document_bytes("xlsx")
          assert DocumentProcessor.detect_format("sheet.xlsx", file_bytes=grid_source) == "xlsx"
          grid = DocumentProcessor.read_excel_grid(grid_source)
          grid[0][0] = "Grid cell"
          grid_result = DocumentProcessor.modify_excel_grid(grid_source, grid)
          assert load_workbook(io.BytesIO(grid_result)).active["A1"].value == "Grid cell"

          # DOCX embedded image extraction must work for the preview.
          image_stream = io.BytesIO()
          Image.new("RGB", (16, 16), "blue").save(image_stream, format="PNG")
          sample_image = image_stream.getvalue()
          assert DocumentProcessor.detect_format("photo.png", file_bytes=sample_image) == "image"
          assert DocumentProcessor.detect_format("photo.jpg", file_bytes=sample_image) == "image"
          normalized = DocumentProcessor.normalize_image_bytes(sample_image)
          with Image.open(io.BytesIO(normalized)) as decoded:
              assert decoded.format == "PNG" and decoded.size == (16, 16)
          with_image = DocumentProcessor.add_image_to_docx(original.getvalue(), sample_image)
          embedded_images = DocumentProcessor.extract_docx_images(with_image)
          assert len(embedded_images) == 1
          assert Image.open(io.BytesIO(DocumentProcessor.normalize_image_bytes(embedded_images[0]))).format == "PNG"

          # PPTX: new slide and image are retained in the package.
          from pptx import Presentation
          pptx_source = DocumentProcessor.create_document_bytes("pptx")
          pptx_source = DocumentProcessor.add_slide_to_pptx(pptx_source)
          image_stream = io.BytesIO()
          Image.new("RGB", (16, 16), "red").save(image_stream, format="PNG")
          pptx_result = DocumentProcessor.add_image_to_pptx(pptx_source, image_stream.getvalue())
          presentation = Presentation(io.BytesIO(pptx_result))
          assert len(presentation.slides) == 2
          assert any(shape.shape_type == 13 for shape in presentation.slides[-1].shapes)
          slide_data = DocumentProcessor.extract_pptx_slides(pptx_result)
          assert len(slide_data) == 2
          assert slide_data[-1]["images"]

          print("Document processing tests passed.")
          PY

      - name: Prepare python-for-android
        shell: bash
        run: |
          set -euo pipefail
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/lxml/__init__.py"
          # 4.9.3 supports Python 3.11 and keeps p4a's STATIC build interface.
          sed -i "s/version = '4.8.0'/version = '4.9.3'/" "$RECIPE"
          grep -q "version = '4.9.3'" "$RECIPE"
          grep -n "version =" "$RECIPE" | head -1

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -f main.py
          test -f document_core.py
          grep -n '^requirements' buildozer.spec

      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 P4A_RELEASE_KEYSTORE_PASSWD P4A_RELEASE_KEYALIAS P4A_RELEASE_KEYALIAS_PASSWD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for release signing: $name (configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
              exit 1
            fi
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/list-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/list-release.keystore" -storepass "$P4A_RELEASE_KEYSTORE_PASSWD" -alias "$P4A_RELEASE_KEYALIAS" >/dev/null
          echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/list-release.keystore" >> "$GITHUB_ENV"
          echo "P4A_RELEASE_KEYSTORE_PASSWD=$P4A_RELEASE_KEYSTORE_PASSWD" >> "$GITHUB_ENV"
          echo "P4A_RELEASE_KEYALIAS=$P4A_RELEASE_KEYALIAS" >> "$GITHUB_ENV"
          echo "P4A_RELEASE_KEYALIAS_PASSWD=$P4A_RELEASE_KEYALIAS_PASSWD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          mkdir -p build-report
          set -o pipefail
          buildozer -v android release 2>&1 | tee build-report/build.log

      - name: Verify release APK signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find bin -maxdepth 1 -type f -name '*-release.apk' -print)
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" dist/List-release.apk
          ls -lh dist/List-release.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: List-Release-APK
          path: dist/List-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: List-Build-Log
          path: build-report/build.log
          if-no-files-found: warn
          retention-days: 14
