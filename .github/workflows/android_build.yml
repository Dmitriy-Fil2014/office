
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          source "$RUNNER_TEMP/build_env/bin/activate"

          buildozer -v android debug > build_log.txt 2>&1
          result=$?

          echo "Build exit code: $result"

          {
            echo "BUILD EXIT CODE: $result"
            echo ""
            echo "=== ERROR MATCHES ==="
            grep -in -B 5 -A 10 -E \
              'error:|fatal error|exception|traceback|failed|failure|undefined macro|LT_SYS_SYMBOL_USCORE|license|permission denied|no such file|not found|timed out|could not|cannot' \
              build_log.txt | tail -n 160 || true

            echo ""
            echo "=== LAST 80 LINES ==="
            tail -n 80 build_log.txt
          } > error_summary.txt

          cat error_summary.txt

          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi

          shopt -s nullglob
          apks=(bin/*.apk)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: APK not found" >> error_summary.txt
            exit 1
          fi

          mkdir -p artifacts
          cp "${apks[@]}" artifacts/

      - name: Upload error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-Error-Summary
          path: error_summary.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Local-Office-APK
          path: artifacts/*.apk
          if-no-files-found: error
