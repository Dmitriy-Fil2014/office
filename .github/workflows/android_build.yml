name: Лист — сборка APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Сборка APK для Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip curl wget \
            autoconf automake autopoint libtool libtool-bin \
            pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            libxml2-dev libxslt1-dev

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Configure Android paths
        shell: bash
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          test -x "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          test -x "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl"

      - name: Install Buildozer and host test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36"
          python -m pip install "python-docx" "openpyxl" "pypdf" "lxml==4.9.3"

      - name: Test document processing
        run: |
          python -m py_compile main.py document_core.py
          python - <<'PY'
          import io
          from docx import Document
          from openpyxl import Workbook, load_workbook
          from document_core import DocumentProcessor

          # DOCX: text edit must keep a table and embedded image relationship
          doc = Document()
          doc.add_paragraph("First")
          table = doc.add_table(rows=1, cols=1)
          table.cell(0, 0).text = "Cell"
          original = io.BytesIO()
          doc.save(original)
          edited = DocumentProcessor.modify_word_bytes(original.getvalue(), "Changed\nCell edited")
          reopened = Document(io.BytesIO(edited))
          assert reopened.paragraphs[0].text == "Changed"
          assert reopened.tables[0].cell(0, 0).text == "Cell edited"

          # XLSX: workbook structure and second sheet survive editing.
          book = Workbook()
          book.active["A1"] = "Old"
          book.create_sheet("Keep")["A1"] = "Preserve"
          original_xlsx = io.BytesIO()
          book.save(original_xlsx)
          edited_xlsx = DocumentProcessor.modify_excel_bytes(original_xlsx.getvalue(), "New")
          reopened_xlsx = load_workbook(io.BytesIO(edited_xlsx))
          assert reopened_xlsx.active["A1"].value == "New"
          assert reopened_xlsx["Keep"]["A1"].value == "Preserve"
          print("Document processing tests passed.")
          PY

      - name: Prepare python-for-android
        shell: bash
        run: |
          set -euo pipefail
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/lxml/__init__.py"
          # 4.9.3 supports Python 3.11 and keeps p4a's STATIC build interface.
          sed -i "s/version = '4.8.0'/version = '4.9.3'/" "$RECIPE"
          grep -q "version = '4.9.3'" "$RECIPE"
          grep -n "version =" "$RECIPE" | head -1

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -f main.py
          test -f document_core.py
          grep -n '^requirements' buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build-report
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-report/build.log

      - name: Check APK
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          find . -type f -name "*.apk" \
            -not -path "./.buildozer/*" \
            -not -path "./.git/*" \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: List-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: List-Build-Log
          path: build-report/build.log
          if-no-files-found: warn
          retention-days: 14
