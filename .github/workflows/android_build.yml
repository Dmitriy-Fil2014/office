name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Скачиваем чистый код
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 под Node 24
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Устанавливаем системные пакеты Linux
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    # 4. Ставим самую свежую стабильную ветку Buildozer
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install cython virtualenv wheel setuptools
        pip3 install git+https://github.com

    # 5. Запуск компиляции с автоматическим перехватом и выводом скрытых ошибок
    - name: Build Android APK
      run: |
        # Записываем весь вывод во временный лог-файл, чтобы поймать ошибку
        yes | buildozer android debug 2>&1 | tee build_output.log
        
        # Проверяем статус сборки. Если она упала (exit code не 0) - вытаскиваем финал лога наружу
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "::error::--- КРИТИЧЕСКАЯ ОШИБКА СБОРЩИКА BUILDOZER ---"
          while read -r line; do
            echo "::error::$line"
          done < <(tail -n 50 build_output.log)
          exit 1
        fi
