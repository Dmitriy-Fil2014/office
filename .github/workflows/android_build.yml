name: Build Local Office APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Скачиваем чистый код
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Настраиваем Java 17 под Node 24
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Устанавливаем системные пакеты Linux
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    # 4. Ставим самую свежую стабильную версию Buildozer
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install cython virtualenv wheel setuptools
        pip3 install git+https://github.com

    # 5. Запуск компиляции с обходом проверки root-прав
    - name: Build Android APK
      run: |
        # Заставляем билд идти без интерактивных вопросов про root
        buildozer android debug || echo "Сборка завершилась, выводим лог ниже:"
        
        # Если билд упал, мы принудительно выводим последние 100 строк системного лога Buildozer
        if [ ! -f bin/*.apk ]; then
          echo "::error::--- КРИТИЧЕСКАЯ СБОРКА УПАЛА. ВЫВОД СИСТЕМНОГО ЖУРНАЛА: ---"
          if [ -d .buildozer/android/platform/python-for-android ]; then
            tail -n 100 .buildozer/config.ini 2>/dev/null || true
          fi
          # Если файл apk не появился, завершаем шаг ошибкой
          exit 1
        fi

    # 6. Загружаем готовый APK-файл в раздел артефактов GitHub
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Local-Office-APK
        path: bin/*.apk
