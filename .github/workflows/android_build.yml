name: Build Android APK (Local-Office)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      PATH: ${{ env.JAVA_HOME }}/bin:${{ env.PATH }}

    steps:
      - name: Checkout repository (Node 22 stable)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies (Java 17, build tools, libffi)
        run: |
          sudo apt-get update
          sudo apt-get install -y temurin-17-jdk-headless
          
          # Макросы для автоконфигурации
          sudo apt-get install -y autoconf automake libtool libtool-bin m4 pkg-config
          
          # Критически важные библиотеки для hostpython3 и Kivy
          sudo apt-get install -y build-essential git python3 python3-venv python3-dev \
            libssl-dev libffi-dev zlib1g-dev libjpeg-dev libtiff-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev
            
          # FIX: Создаем симлинк libffi.so.6, который требует старый Python 3.10 из hostpython3
          # в Ubuntu 24.04 по умолчанию стоит libffi.so.8
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 /usr/lib/x86_64-linux-gnu/libffi.